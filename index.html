<!-- index.html -->
<div id="app">
  <!-- Library menu entry button -->
  <button id="libraryBtn">📚 Library</button>

  <!-- Library panel -->
  <div id="libraryPanel" class="hidden">
    <div class="tabs">
      <button class="tab active" data-tab="tracks">Tracks</button>
      <button class="tab" data-tab="albums">Albums</button>
      <button class="tab" data-tab="types">File Type</button>
    </div>
    <ul id="trackList" class="list"></ul>
  </div>

  <!-- Folder selection -->
  <button id="pickFolderBtn">📁 Select Music Folder</button>
</div>
